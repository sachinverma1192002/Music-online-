<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Online</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;

  background:
    radial-gradient(circle at 20% 10%, #422080 0%, transparent 35%),
    radial-gradient(circle at 90% 90%, #064d70 0%, transparent 35%),
    linear-gradient(135deg, #08080d, #151020, #05080d);

  background-attachment: fixed;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  font-size: 30px;
  margin-bottom: 5px;
}

.header p {
  color: #aaa;
  font-size: 14px;
}

.search {
  width: 100%;
  padding: 14px 18px;
  margin-bottom: 18px;

  border: 1px solid rgba(255,255,255,.15);
  border-radius: 30px;

  background: rgba(255,255,255,.08);
  color: white;
  outline: none;
  font-size: 15px;
}

.search::placeholder {
  color: #aaa;
}

.player {
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px);

  border: 1px solid rgba(255,255,255,.12);
  border-radius: 25px;

  padding: 22px;
  text-align: center;

  box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

.cover {
  width: min(72vw, 300px);
  height: min(72vw, 300px);

  object-fit: cover;
  display: block;

  margin: 0 auto 20px;

  border-radius: 20px;

  box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

.song {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 6px;
}

.artist {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 20px;
}

#progress {
  width: 100%;
  accent-color: white;
}

.time {
  display: flex;
  justify-content: space-between;

  color: #999;
  font-size: 12px;

  margin-top: 6px;
  margin-bottom: 20px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
}

button {
  border: none;
  background: transparent;
  color: white;

  font-size: 26px;
  cursor: pointer;
}

.play {
  width: 62px;
  height: 62px;

  border-radius: 50%;

  background: white;
  color: black;

  font-size: 24px;
}

.playlist {
  margin-top: 20px;
}

.playlist h2 {
  font-size: 18px;
  margin-bottom: 10px;
}

.songItem {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px;
  margin-bottom: 8px;

  background: rgba(255,255,255,.07);

  border: 1px solid rgba(255,255,255,.08);
  border-radius: 15px;

  cursor: pointer;
}

.songItem:hover {
  background: rgba(255,255,255,.13);
}

.songNumber {
  width: 30px;
  text-align: center;
  color: #aaa;
}

.songInfo {
  flex: 1;
  min-width: 0;
}

.songTitle {
  font-size: 14px;
  font-weight: bold;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.songArtist {
  font-size: 12px;
  color: #888;
  margin-top: 3px;
}

.active {
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.35);
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎵 Music Online</h1>
    <p>Your music player</p>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search song..."
  >

  <div class="player">

    <img
      id="cover"
      class="cover"
      src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80"
      alt="Album Cover"

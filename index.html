<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Online</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 10% 0%, #5b21b6 0%, transparent 32%),
    radial-gradient(circle at 100% 100%, #075985 0%, transparent 35%),
    linear-gradient(145deg, #050509, #11101c 55%, #05080d);
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 8px 0 20px;
}

.logo {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span {
  color: #b58cff;
}

.tagline {
  color: #999;
  font-size: 13px;
  margin-top: 6px;
}

/* SEARCH */

.searchBox {
  position: relative;
  margin-bottom: 18px;
}

.search {
  width: 100%;
  height: 50px;
  padding: 0 18px 0 46px;

  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;

  outline: none;
  background: rgba(255,255,255,.08);
  color: white;

  font-size: 15px;
  backdrop-filter: blur(18px);
}

.searchIcon {
  position: absolute;
  left: 17px;
  top: 15px;
  color: #aaa;
}

/* PLAYER */

.player {
  padding: 20px;
  border-radius: 28px;

  background: rgba(255,255,255,.075);
  border: 1px solid rgba(255,255,255,.12);

  backdrop-filter: blur(25px);

  box-shadow:
    0 25px 60px rgba(0,0,0,.45);
}

/* COVER */

.coverWrap {
  position: relative;
  width: min(78vw, 320px);
  height: min(78vw, 320px);
  margin: 0 auto 22px;
}

.cover {
  width: 100%;
  height: 100%;

  object-fit: cover;
  border-radius: 24px;

  box-shadow:
    0 20px 45px rgba(0,0,0,.55);
}

/* SONG INFO */

.song {
  font-size: 23px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  text-align: center;
}

.artist {
  color: #999;
  font-size: 14px;
  margin-top: 7px;
  text-align: center;
}

/* PROGRESS */

.progressArea {
  margin-top: 24px;
}

#progress {
  width: 100%;
  accent-color: #fff;
  cursor: pointer;
}

.time {
  display: flex;
  justify-content: space-between;

  color: #888;
  font-size: 11px;

  margin-top: 6px;
}

/* CONTROLS */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 32px;
  margin-top: 20px;
}

.controlBtn {
  border: 0;
  background: transparent;
  color: white;

  font-size: 25px;
  cursor: pointer;
}

.playBtn {
  width: 68px;
  height: 68px;

  border: 0;
  border-radius: 50%;

  background: white;
  color: #111;

  font-size: 25px;
  cursor: pointer;

  box-shadow:
    0 10px 30px rgba(255,255,255,.18);
}

/* PLAYLIST */

.playlist {
  margin-top: 24px;
}

.playlistHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 12px;
}

.playlistHeader h2 {
  font-size: 19px;
}

.count {
  color: #888;
  font-size: 12px;
}

.songItem {
  display: flex;
  align-items: center;

  gap: 12px;

  padding: 13px;
  margin-bottom: 8px;

  border-radius: 17px;

  background: rgba(255,255,255,.065);
  border: 1px solid rgba(255,255,255,.06);

  cursor: pointer;

  transition: .2s;
}

.songItem:hover {
  background: rgba(255,255,255,.11);
}

.songItem.active {
  background: rgba(255,255,255,.14);
  border-color: rgba(255,255,255,.25);
}

.number {
  width: 27px;
  text-align: center;
  color: #888;
  font-size: 13px;
}

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-size: 14px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  color: #777;
  font-size: 11px;
  margin-top: 4px;
}

.songPlay {
  font-size: 16px;
  color: #aaa;
}

.empty {
  text-align: center;
  color: #777;
  padding: 25px;
}

/* MOBILE */

@media (max-width: 420px) {

  .container {
    padding: 14px;
  }

  .player {
    padding: 16px;
  }

  .song {
    font-size: 20px;
  }

  .controls {
    gap: 25px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">Music <span>Online</span></div>
    <div class="tagline">Listen to your favorite music</div>
  </div>


  <div class="searchBox">

    <span class="searchIcon">🔎</span>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Search your song..."
      autocomplete="off"
    >

  </div>


  <div class="player">

    <div class="coverWrap">

      <img
        id="cover"
        class="cover"
        src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80"
        alt="Music Cover"
      >

    </div>


    <div id="song" class="song">
      Sochenge Tumhe Pyar
    </div>

    <div id="artist" class="artist">
      Music Online
    </div>


    <div class="progressArea">

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
      >

      <div class="time">

        <span id="current">0:00</span>

        <span id="duration">0:00</span>

      </div>

    </div>


    <div class="controls">

      <button
        class="controlBtn"
        onclick="previousSong()"
      >
        ⏮
      </button>


      <button
        id="play"
        class="playBtn"
        onclick="togglePlay()"
      >
        ▶
      </button>


      <button
        class="controlBtn"
        onclick="nextSong()"
      >
        ⏭
      </button>

    </div>

  </div>


  <div class="playlist">

    <div class="playlistHeader">

      <h2>🎶 Playlist</h2>

      <span id="count" class="count">
        9 Songs
      </span>

    </div>

    <div id="list"></div>

  </div>

</div>


<audio id="audio"></audio>


<script>

const songs = [

  {
    name: "Sochenge Tumhe Pyar",
    file: "Sochenge Tumhe Pyar.mp3"
  },

  {
    name: "Mera Dil Bhi Kitna Pagal Hai",
    file: "Mera Dil Bhi Kitna Pagal Hai.mp3"
  },

  {
    name: "Dil Hai Ke Manta Nahin",
    file: "Dil Hai Ke Manta Nahin.mp3"
  },

  {
    name: "Saari Raat Teri Yaad",
    file: "Saari Raat Teri Yaad.mp3"
  },

  {
    name: "O Mere Dil Ke Chain",
    file: "O Mere Dil Ke Chain.mp3"
  },

  {
    name: "Kitni Bechain Hoke",
    file: "Kitni Bechain Hoke.mp3"
  },

  {
    name: "Jo Bhi Kasmein",
    file: "Jo Bhi Kasmein.mp3"
  },

  {
    name: "Falak Dekhun Full Song With Lyrics by Sonu Nigam",
    file: "Falak Dekhun Full Song With Lyrics by Sonu Nigam.mp3"
  },

  {
    name: "MUJHE RAAT DIN BAS",
    file: "MUJHE RAAT DIN BAS.mp3"
  }

];


let currentSong = 0;


const audio =
  document.getElementById("audio");

const play =
  document.getElementById("play");

const progress =
  document.getElementById("progress");

const song =
  document.getElementById("song");

const artist =
  document.getElementById("artist");

const cover =
  document.getElementById("cover");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const list =
  document.getElementById("list");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");


function loadSong(index) {

  currentSong = index;

  song.textContent =
    songs[index].name;

  artist.textContent =
    "Music Online";

  audio.src =
    encodeURI(songs[index].file);

  audio.load();

  progress.value = 0;

  current.textContent = "0:00";

  duration.textContent = "0:00";

  showPlaylist(search.value);
}


function togglePlay() {

  if (audio.paused) {

    audio.play()
      .then(function() {

        play.textContent = "⏸";

      })
      .catch(function() {

        alert("Song load nahi ho raha.");

      });

  } else {

    audio.pause();

    play.textContent = "▶";

  }

}


function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {

    currentSong = 0;

  }

  loadSong(currentSong);

  audio.play()
    .then(function() {

      play.textContent = "⏸";

    })
    .catch(function() {

      play.textContent = "▶";

    });

}


function previousSong() {

  currentSong--;

  if (currentSong < 0) {

    currentSong =
      songs.length - 1;

  }

  loadSong(currentSong);

  audio.play()
    .then(function() {

      play.textContent = "⏸";

    })
    .catch(function() {

      play.textContent = "▶";

    });

}


audio.addEventListener(
  "loadedmetadata",
  function() {

    duration.textContent =
      formatTime(audio.duration);

  }
);


audio.addEventListener(
  "timeupdate",
  function() {

    if (audio.duration) {

      progress.value =
        (audio.currentTime /
        audio.duration) * 100;

    }

    current.textContent =
      formatTime(audio.currentTime);

  }
);


audio.addEventListener(
  "ended",
  function() {

    nextSong();

  }
);


progress.addEventListener(
  "input",
  function() {

    if (audio.duration) {

      audio.currentTime =
        (progress.value / 100) *
        audio.duration;

    }

  }
);


function formatTime(seconds) {

  if (!seconds || isNaN(seconds)) {

    return "0:00";

  }

  const minutes =
    Math.floor(seconds / 60);

  const secondsPart =
    Math.floor(seconds % 60);

  return minutes + ":" +
    String(secondsPart)
      .padStart(2, "0");

}


function showPlaylist(query) {

  list.innerHTML = "";

  query =
    query.toLowerCase().trim();

  let found = 0;


  songs.forEach(function(item, index) {

    if (
      !item.name
        .toLowerCase()
        .includes(query)
    ) {

      return;

    }


    found++;


    const div =
      document.createElement("div");

    div.className =
      "songItem";


    if (index === currentSong) {

      div.classList.add("active");

    }


    div.innerHTML = `

      <div class="number">
        ${index + 1}
      </div>

      <div class="info">

        <div class="title">
          ${item.name}
        </div>

        <div class="sub">
          Music Online
        </div>

      </div>

      <div class="songPlay">
        ▶
      </div>

    `;


    div.onclick = function() {

      loadSong(index);

      audio.play()
        .then(function() {

          play.textContent = "⏸";

        })
        .catch(function() {

          play.textContent = "▶";

        });

    };


    list.appendChild(div);

  });


  count.textContent =
    found + (found === 1 ? " Song" : " Songs");


  if (found === 0) {

    list.innerHTML =
      '<div class="empty">Song nahi mila</div>';

  }

}


search.addEventListener(
  "input",
  function() {

    showPlaylist(search.value);

  }
);


loadSong(0);

</script>

</body>
</html>

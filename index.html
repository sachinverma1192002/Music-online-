<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Online</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 20% 10%, #4b207c, transparent 35%),
    radial-gradient(circle at 90% 90%, #07546b, transparent 35%),
    #08090f;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 30px;
}

.header p {
  color: #aaa;
  margin-top: 5px;
}

.search {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid #444;
  border-radius: 30px;
  background: #181820;
  color: white;
  outline: none;
  font-size: 16px;
  margin-bottom: 20px;
}

.search::placeholder {
  color: #999;
}

.player {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 25px;
  padding: 20px;
  text-align: center;
}

.cover {
  width: min(75vw, 300px);
  height: min(75vw, 300px);
  object-fit: cover;
  border-radius: 20px;
  display: block;
  margin: 0 auto 20px;
}

.song {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 6px;
}

.artist {
  color: #aaa;
  margin-bottom: 20px;
}

#progress {
  width: 100%;
}

.time {
  display: flex;
  justify-content: space-between;
  color: #999;
  font-size: 12px;
  margin: 6px 0 20px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
}

button {
  border: 0;
  background: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.play {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 25px;
}

.playlist {
  margin-top: 25px;
}

.playlist h2 {
  margin-bottom: 12px;
}

.songItem {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  cursor: pointer;
}

.songItem.active {
  background: rgba(255,255,255,0.18);
}

.number {
  width: 25px;
  color: #aaa;
}

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  color: #888;
  font-size: 12px;
  margin-top: 4px;
}

.no-result {
  text-align: center;
  color: #888;
  padding: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎵 Music Online</h1>
    <p>Your music player</p>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search song..."
  >

  <div class="player">

    <img
      id="cover"
      class="cover"
      src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80"
      alt="Music"
    >

    <div id="song" class="song">Sochenge Tumhe Pyar</div>

    <div id="artist" class="artist">Music Online</div>

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
    >

    <div class="time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">

      <button onclick="previousSong()">⏮</button>

      <button
        id="play"
        class="play"
        onclick="togglePlay()"
      >▶</button>

      <button onclick="nextSong()">⏭</button>

    </div>

  </div>

  <div class="playlist">

    <h2>🎶 Playlist</h2>

    <div id="list"></div>

  </div>

</div>

<audio id="audio"></audio>

<script>

const songs = [

  {
    name: "Sochenge Tumhe Pyar",
    file: "Sochenge Tumhe Pyar.mp3"
  },

  {
    name: "Mera Dil Bhi Kitna Pagal Hai",
    file: "Mera Dil Bhi Kitna Pagal Hai.mp3"
  },

  {
    name: "Dil Hai Ke Manta Nahin",
    file: "Dil Hai Ke Manta Nahin.mp3"
  },

  {
    name: "Saari Raat Teri Yaad",
    file: "Saari Raat Teri Yaad.mp3"
  },

  {
    name: "O Mere Dil Ke Chain",
    file: "O Mere Dil Ke Chain.mp3"
  },

  {
    name: "Kitni Bechain Hoke",
    file: "Kitni Bechain Hoke.mp3"
  },

  {
    name: "Jo Bhi Kasmein",
    file: "Jo Bhi Kasmein.mp3"
  },

  {
    name: "Falak Dekhun Full Song With Lyrics by Sonu Nigam",
    file: "Falak Dekhun Full Song With Lyrics by Sonu Nigam.mp3"
  },

  {
    name: "MUJHE RAAT DIN BAS",
    file: "MUJHE RAAT DIN BAS.mp3"
  }

];

let currentSong = 0;

const audio = document.getElementById("audio");
const play = document.getElementById("play");
const progress = document.getElementById("progress");

const song = document.getElementById("song");
const artist = document.getElementById("artist");

const current = document.getElementById("current");
const duration = document.getElementById("duration");

const list = document.getElementById("list");
const search = document.getElementById("search");


function loadSong(index) {

  currentSong = index;

  song.textContent = songs[index].name;

  artist.textContent = "Music Online";

  audio.src = encodeURI(songs[index].file);

  audio.load();

  progress.value = 0;

  current.textContent = "0:00";

  duration.textContent = "0:00";

  showPlaylist(search.value);
}


function togglePlay() {

  if (audio.paused) {

    audio.play()
      .then(function() {
        play.textContent = "⏸";
      })
      .catch(function() {
        alert("Song load nahi ho raha.");
      });

  } else {

    audio.pause();

    play.textContent = "▶";

  }
}


function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {
    currentSong = 0;
  }

  loadSong(currentSong);

  audio.play()
    .then(function() {
      play.textContent = "⏸";
    })
    .catch(function() {
      play.textContent = "▶";
    });
}


function previousSong() {

  currentSong--;

  if (currentSong < 0) {
    currentSong = songs.length - 1;
  }

  loadSong(currentSong);

  audio.play()
    .then(function() {
      play.textContent = "⏸";
    })
    .catch(function() {
      play.textContent = "▶";
    });
}


audio.addEventListener("loadedmetadata", function() {

  duration.textContent = formatTime(audio.duration);

});


audio.addEventListener("timeupdate", function() {

  if (audio.duration) {

    progress.value =
      (audio.currentTime / audio.duration) * 100;

  }

  current.textContent =
    formatTime(audio.currentTime);

});


audio.addEventListener("ended", function() {

  nextSong();

});


audio.addEventListener("error", function() {

  console.log("Audio error:", audio.src);

});


progress.addEventListener("input", function() {

  if (audio.duration) {

    audio.currentTime =
      (progress.value / 100) * audio.duration;

  }

});


function formatTime(seconds) {

  if (!seconds || isNaN(seconds)) {
    return "0:00";
  }

  const min = Math.floor(seconds / 60);

  const sec = Math.floor(seconds % 60);

  return min + ":" + String(sec).padStart(2, "0");
}


function showPlaylist(query) {

  list.innerHTML = "";

  query = query.toLowerCase().trim();

  let found = 0;

  songs.forEach(function(item, index) {

    if (!item.name.toLowerCase().includes(query)) {
      return;
    }

    found++;

    const div = document.createElement("div");

    div.className = "songItem";

    if (index === currentSong) {
      div.classList.add("active");
    }

    div.innerHTML = `
      <div class="number">${index + 1}</div>

      <div class="info">
        <div class="title">${item.name}</div>
        <div class="sub">Music Online</div>
      </div>

      <div>▶</div>
    `;

    div.onclick = function() {

      loadSong(index);

      audio.play()
        .then(function() {
          play.textContent = "⏸";
        })
        .catch(function() {
          play.textContent = "▶";
        });

    };

    list.appendChild(div);

  });

  if (found === 0) {

    list.innerHTML =
      '<div class="no-result">Song nahi mila</div>';

  }

}


search.addEventListener("input", function() {

  showPlaylist(search.value);

});


loadSong(0);

</script>

</body>
</html>

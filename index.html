<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Online</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.player {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  padding: 25px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

.cover {
  width: min(78vw, 330px);
  height: min(78vw, 330px);
  object-fit: cover;
  border-radius: 18px;
  margin: 0 auto 25px;
}

.song {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 7px;
}

.artist {
  color: #999;
  margin-bottom: 25px;
}

#progress {
  width: 100%;
  margin-bottom: 8px;
}

.time {
  display: flex;
  justify-content: space-between;
  color: #888;
  font-size: 12px;
  margin-bottom: 25px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
}

button {
  border: none;
  background: transparent;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.play {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 25px;
}
</style>
</head>

<body>

<div class="player">

  <img
    id="cover"
    class="cover"
    src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80"
  >

  <div id="song" class="song">Sochenge Tumhe Pyar</div>

  <div id="artist" class="artist">Music Online</div>

  <input id="progress" type="range" min="0" max="100" value="0">

  <div class="time">
    <span id="current">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">

    <button onclick="previousSong()">⏮</button>

    <button id="playBtn" class="play" onclick="togglePlay()">▶</button>

    <button onclick="nextSong()">⏭</button>

  </div>

</div>

<audio id="audio"></audio>

<script>

const songs = [

  {
    name: "Sochenge Tumhe Pyar",
    artist: "Music Online",
    file: "Sochenge Tumhe Pyar.mp3",
    cover: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=800&q=80"
  }

];

let currentSong = 0;

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const songName = document.getElementById("song");
const artistName = document.getElementById("artist");
const cover = document.getElementById("cover");
const currentTime = document.getElementById("current");
const duration = document.getElementById("duration");


function loadSong(index) {

  const song = songs[index];

  songName.textContent = song.name;
  artistName.textContent = song.artist;
  cover.src = song.cover;

  audio.src = encodeURI(song.file);

  audio.load();

  progress.value = 0;
}


function togglePlay() {

  if (audio.paused) {

    audio.play()
      .then(() => {
        playBtn.textContent = "⏸";
      })
      .catch(() => {
        alert("Song load nahi ho pa raha.");
      });

  } else {

    audio.pause();
    playBtn.textContent = "▶";

  }

}


function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {
    currentSong = 0;
  }

  loadSong(currentSong);

  audio.play()
    .then(() => {
      playBtn.textContent = "⏸";
    })
    .catch(() => {
      playBtn.textContent = "▶";
    });

}


function previousSong() {

  currentSong--;

  if (currentSong < 0) {
    currentSong = songs.length - 1;
  }

  loadSong(currentSong);

  audio.play()
    .then(() => {
      playBtn.textContent = "⏸";
    })
    .catch(() => {
      playBtn.textContent = "▶";
    });

}


audio.addEventListener("loadedmetadata", () => {

  duration.textContent = formatTime(audio.duration);

});


audio.addEventListener("timeupdate", () => {

  if (audio.duration) {
    progress.value =
      (audio.currentTime / audio.duration) * 100;
  }

  currentTime.textContent =
    formatTime(audio.currentTime);

});


audio.addEventListener("ended", () => {

  nextSong();

});


audio.addEventListener("error", () => {

  console.log("Audio load error:", audio.src);

});


progress.addEventListener("input", () => {

  if (audio.duration) {

    audio.currentTime =
      (progress.value / 100) * audio.duration;

  }

});


function formatTime(seconds) {

  if (!seconds || isNaN(seconds)) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);

  const secondsPart =
    Math.floor(seconds % 60);

  return minutes + ":" +
    String(secondsPart).padStart(2, "0");

}


loadSong(currentSong);

</script>

</body>
</html>
